name: Send Weekend Prompt

on:
  schedule:
    - cron: "30 2 * * 5"
  workflow_dispatch:

jobs:
  send-prompt:
    runs-on: ubuntu-latest

    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
      EMAIL_APP_PASSWORD: ${{ secrets.EMAIL_APP_PASSWORD }}
      EMAIL_TO: ${{ secrets.EMAIL_TO }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt
      
      - name: Check environment variables
        run: |
                python -c "import os; print('GEMINI:', bool(os.getenv('GEMINI_API_KEY'))); print('EMAIL_FROM:', bool(os.getenv('EMAIL_FROM'))); print('EMAIL_APP_PASSWORD:', bool(os.getenv('EMAIL_APP_PASSWORD'))); print('EMAIL_TO:', bool(os.getenv('EMAIL_TO')))"
    
      - name: Send weekend prompt
        run: python main.py